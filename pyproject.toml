[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-directory"
version = "4.0.2"
description = "Share files from your computer for free. One command gives anyone a public link — no account, no upload, no cost."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["free file sharing","share folder online","share files free","no upload","instant file sharing","share large files","one command","public link","file browser","file server","folder sharing","cloudflare","cloudflare tunnel","ngrok alternative","expose localhost","temporary file sharing","file transfer","cli","python"]

[project.scripts]
global-directory = "global_directory.cli:main"

[project.urls]
Homepage = "https://github.com/deevanshuguru/global-directory"
Repository = "https://github.com/deevanshuguru/global-directory"
PyPI = "https://pypi.org/project/global-directory/"

# Ensures templates/ and static/ are included in PyPI distribution.
# Without this, pip install would get Python files only and the server would crash.
[tool.setuptools.package-data]
"global_directory" = ["templates/*.html", "static/*.css", "static/*.js"]
